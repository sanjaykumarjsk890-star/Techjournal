<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO Meta Tags -->
    <title>TechJournal – Technology Blog &amp; Engineering Insights</title>
    <meta name="title" content="TechJournal – Technology Blog &amp; Engineering Insights" />

      name="description"
      content="Discover in-depth technology articles, modern software engineering insights, cloud architecture patterns, and artificial intelligence breakthroughs on TechJournal."

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

      property="og:description"

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />

      property="twitter:description"
      content="Discover in-depth technology articles, modern software engineering insights, cloud architecture patterns, and artificial intelligence breakthroughs on TechJournal."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
